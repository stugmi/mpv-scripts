# Optional: copy to %APPDATA%/mpv/script-opts/clipper.conf. Every line is optional.
output=~/Videos/Clips
# length of the initial selection and of each fetch step, in seconds
seconds=30
# footage loaded when the editor opens (the selection plus earlier footage), in seconds
backread=60
# how far back a stream's cache should reach for clips, in seconds
history=300
# Windows: py launches Python 3
python=py
ffmpeg=ffmpeg
