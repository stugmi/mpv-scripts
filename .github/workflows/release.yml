name: Build zip

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          python -m py_compile tools/*.py plugins/clipper/scripts/clipper/*.py
          for f in plugins/clipper/scripts/clipper/*.lua plugins/twitch-rewind/scripts/twitch-rewind/main.lua plugins/ModernZ/modernz.lua; do
            luajit -bl "$f" > /dev/null
          done

      # tag -> the tag name; push to the default branch -> "latest"; anything else -> short commit hash
      - name: Version label
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/master" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "label=latest" >> "$GITHUB_OUTPUT"
          else
            echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        run: python tools/package.py --out dist --version "${{ steps.version.outputs.label }}"

      - name: Check the zip contents
        run: python tools/check_zip.py dist/*.zip

      - name: Smoke test (extract into an empty folder, then run the installer over it)
        run: |
          mkdir -p "$RUNNER_TEMP/from-zip"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/from-zip"
          test -f "$RUNNER_TEMP/from-zip/scripts/twitch-rewind/main.lua"
          mkdir -p "$RUNNER_TEMP/mpv-test"
          python tools/install.py --target "$RUNNER_TEMP/mpv-test" --dry-run
          python tools/install.py --target "$RUNNER_TEMP/mpv-test"
          python tools/install.py --target "$RUNNER_TEMP/mpv-test" | grep -q "Already up to date"

      - uses: actions/upload-artifact@v4
        with:
          name: twitch-rewind-clipper-${{ steps.version.outputs.label }}
          path: dist/*.zip
          if-no-files-found: error

  # A pushed v* tag publishes a numbered release.
  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twitch-rewind-clipper-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # Every push to the default branch refreshes one rolling release called "latest": the zip is a build of
  # that commit, ready to extract into the mpv config folder. The "latest" tag moves to the new commit.
  latest:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twitch-rewind-clipper-*
          path: dist
          merge-multiple: true

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Extract the zip into your mpv config folder (INSTALL-twitch-rewind-clipper.txt inside explains the rest). For a numbered version, see the other releases."
